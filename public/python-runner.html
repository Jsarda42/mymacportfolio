<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
    <script>
        let pyodide;
        async function init() {
            pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/" });
            await pyodide.runPythonAsync(`
import sys, io, traceback

def execute_grader(setup_code, user_code, test_code):
    out = io.StringIO()
    sys.stdout = out
    sys.stderr = out
    
    # Critical: Use the same dict for globals and locals
    shared_scope = {}
    
    try:
        exec(setup_code, shared_scope, shared_scope)
        exec(user_code, shared_scope, shared_scope)
        user_output = out.getvalue()

        # Clear buffer for validation output
        out.truncate(0)
        out.seek(0)
        
        exec(test_code, shared_scope, shared_scope)
        test_output = out.getvalue()

        return user_output + "---VALIDATION_START---" + test_output
    except Exception:
        return out.getvalue() + "---VALIDATION_START---❌ Python Error:\\n" + traceback.format_exc()
            `);
            window.parent.postMessage({ type: 'READY' }, '*');
        }

        window.addEventListener('message', async (e) => {
            if (e.data.type === 'RUN') {
                const runner = pyodide.globals.get('execute_grader');
                const result = runner(e.data.setupCode, e.data.userCode, e.data.secretTest);
                window.parent.postMessage({ type: 'RESULT', result }, '*');
            }
        });
        init();
    </script>
</body>
</html>
